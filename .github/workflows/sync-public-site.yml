name: Sync public ぜんにゅー site

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-public-site.yml'
      - '.github/scripts/generate_story_pages.py'
      - '.github/scripts/generate_category_og.py'
      - 'article.html'
      - 'article-v1.css'

permissions:
  contents: write

concurrency:
  group: zennyu-public-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public-site repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out NYU Network source
        uses: actions/checkout@v4
        with:
          repository: blacksmith-tombokiri/nyu-network
          ref: main
          path: _nyu-source
          persist-credentials: false
      - name: Copy only the public zennyu website
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='CNAME' \
            --exclude='.nojekyll' \
            --exclude='story/' \
            --exclude='og-default.png' \
            --exclude='og-category-*.png' \
            --exclude='_nyu-source/' \
            _nyu-source/zennyu/ ./
          rm -rf _nyu-source
      - name: Generate category-thumbnail images (only when absent)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f og-category-good.png ] || [ ! -f og-category-forward.png ] || [ ! -f og-category-nature.png ] || [ ! -f og-category-repair.png ] || [ ! -f og-category-mind.png ] || [ ! -f og-category-food.png ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-noto-cjk
            python3 -m venv /tmp/zennyu-og-py
            /tmp/zennyu-og-py/bin/python -m pip install --disable-pip-version-check pillow==11.3.0
            /tmp/zennyu-og-py/bin/python .github/scripts/generate_category_og.py
          fi
      - name: Generate per-article Open Graph pages
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/generate_story_pages.py
      - name: Commit changes only when source files changed
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'No public-site changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync public zennyu website from nyu-network/main'
          git push origin HEAD:main
