<title>ソラマメ帯を設けたリンゴ園で、アブラムシ被害が平均30％少ない結果｜ぜんにゅー</title>
<meta name="nyu-public-id" content="XsszovBg">
<meta name="description" content="フランスのリンゴ園で、ソラマメを植えた区画の木は、対照区の木に比べてアブラムシによる被害が平均30％少なかったと研究者が報告しました。研究チームは2025年秋、圃場試験の一環として果樹園の端にソラマメの帯を植え、2026年6月にリンゴの木を調べました。確認されたのはこの試験での比較結果で、ソラマメ帯を使った防除の可能性を圃場で測定した段階です。">
