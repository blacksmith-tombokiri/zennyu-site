<script>
document.addEventListener('DOMContentLoaded',()=>{
  const root=document.querySelector('#article-app');
  if(!root)return;
  const updateCopy=()=>{
    root.querySelectorAll('h2').forEach(el=>{
      if(el.textContent.trim()==='関連する善兆')el.textContent='あわせて読みたい善兆';
    });
    root.querySelectorAll('.muted').forEach(el=>{
      if(el.textContent.trim()==='関連する善兆はまだありません。')el.textContent='あわせて読みたい善兆はまだありません。';
    });
  };
  updateCopy();
  new MutationObserver(updateCopy).observe(root,{childList:true,subtree:true});
});
</script>
